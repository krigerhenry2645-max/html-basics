<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Navigation</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Isometra&family=Sancreek&display=swap');
nav {
    background-color: #ebb6b6;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ddd;
}
.nav-item {
    display: flex;
    align-items: center;
    gap: 30px;
}
/* You missed the dot here -> nav-item ul */
.nav-item ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
}
.nav-item ul li {
    margin-right: 20px;
}
.nav-item ul li a {
    text-decoration: none;
    color: #333;
    font-family: 'Isometra', sans-serif;
    font-size: 18px;
    text-transform: uppercase;
}
.nav-item ul li a:hover {
    color: #2e7d32;
    text-decoration: underline;
}
.nav-item img {
    width: 50px;
    height: auto;
}
